<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>스트림 채팅</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:20px;
    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    background:#f1f5f9;
    font-family:Arial,sans-serif;
}

.container{
    width:420px;
    height:90vh;
    max-height:900px;

    display:flex;
    flex-direction:column;

    overflow:hidden;

    background:white;
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,0.1);
}

.header{
    padding:20px;

    background:#2563eb;
    color:white;

    font-size:24px;
    font-weight:bold;
}

#chat{
    flex:1;
    padding:20px;

    overflow-y:auto;

    background:#f8fafc;
}

.message{
    display:flex;
    margin-bottom:16px;
}

.user{
    justify-content:flex-end;
}

.bot{
    justify-content:flex-start;
}

.bubble{
    max-width:75%;
    padding:12px 16px;

    border-radius:16px;

    line-height:1.7;
    word-break:break-word;
}

.user .bubble{
    background:#2563eb;
    color:white;

    border-bottom-right-radius:4px;
}

.bot .bubble{
    background:white;
    border:1px solid #ddd;

    border-bottom-left-radius:4px;
    font-weight:bold;
}

.input-area{
    display:flex;
    gap:10px;

    padding:16px;

    border-top:1px solid #ddd;
    background:white;
}

#input{
    flex:1;

    padding:12px;

    border:1px solid #ccc;
    border-radius:10px;

    outline:none;
    font-size:16px;
}

#input:focus{
    border-color:#2563eb;
}

#send{
    padding:12px 20px;

    border:none;
    border-radius:10px;

    background:#2563eb;
    color:white;

    cursor:pointer;

    font-size:16px;
    font-weight:bold;
}

#send:hover{
    background:#1d4ed8;
}

.highlight-line{
    display:inline-block;

    margin:4px 0;
    padding:4px 8px;

    background:#dbeafe;
    border-radius:8px;

    font-weight:bold;
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        스트림 채팅
    </div>

    <div id="chat"></div>

    <div class="input-area">
        <input type="text" id="input" placeholder="메시지를 입력하세요">
        <button id="send">전송</button>
    </div>

</div>

<script>
const input=document.getElementById('input');
const send=document.getElementById('send');
const chat=document.getElementById('chat');

async function sendMessage(){

    const message=input.value.trim();

    if(!message) return;

    chat.innerHTML+=`
        <div class="message user">
            <div class="bubble">${message}</div>
        </div>
    `;

    chat.scrollTop=chat.scrollHeight;

    input.value='';

    const botMessage=document.createElement('div');
    botMessage.className='message bot';

    const botBubble=document.createElement('div');
    botBubble.className='bubble';

    botMessage.appendChild(botBubble);
    chat.appendChild(botMessage);

    chat.scrollTop=chat.scrollHeight;

    const response=await fetch('/stream',{
        method:'POST',
        headers:{
            'Content-Type':'application/json'
        },
        body:JSON.stringify({message})
    });

    const reader=response.body.getReader();
    const decoder=new TextDecoder();

    let fullText='';

    while(true){

        const {done,value}=await reader.read();

        if(done) break;

        const chunk=decoder.decode(value,{stream:true});

        const cleaned=chunk.replace(/data:\s*/g,'');

        fullText+=cleaned;

        const formatted=fullText
            .split('\n')
            .map(line=>{

                if(line.trim()===''){
                    return `<div style="height:12px;"></div>`;
                }

                if(line.includes('**')){

                    const cleanedLine=line.replace(/\*\*/g,'');

                    return `
                        <div class="highlight-line">
                            ${cleanedLine}
                        </div>
                    `;
                }

                return `<div style="margin-bottom:6px;">${line}</div>`;
            })
            .join('');

        botBubble.innerHTML=formatted;

        chat.scrollTop=chat.scrollHeight;
    }
}

send.addEventListener('click',sendMessage);

input.addEventListener('keydown',e=>{
    if(e.key==='Enter'){
        sendMessage();
    }
});
</script>

</body>
</html>
