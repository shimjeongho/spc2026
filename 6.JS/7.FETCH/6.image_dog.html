      <h1>랜덤 사진 표시</h1>
        <button id="loadBtn">이미지 로딩</button>
        <div id="result"><!-- 응답 데이터를 표시할곳--></div>
    <script>
        // document.getElementById('loadBtn').addEventListener('click', () => {

        //     .then((data) => {
        //         const resultDiv = document.getElementById('result');

        //         // 응답 스펙

        //     .catch((error) => {

        //     })
        // })

        // 밑에 function으로도 가능하다
        document.getElementById('loadBtn').addEventListener('click', () => {
            fetch('https://dog.ceo/api/breeds/image/random')
            .then((response) => response.json())
            .then((data) => {
                if (data.status !== "success") {
                    displayError(data);
                } else {
                    displayResult(data);
                }
            })
            .catch(error => {
                console.error("알수 없는 오류: ", error)
                displayError(error);
            });

            // 이미지 못 불러왔을 경우
            function displayError(error) {
                const result = document.getElementById('result');
                result.innerHTML = `
                    <p style="color: red;">이미지를 불러오지 못했습니다.</p>
                `;
            }

            function displayResult(data) {
               console.log("화면에 DOM 그리기: ", data)
               const result = document.getElementById('result');
               result.innerHTML = `
                    <img src="${data.message}" width="400px" >
               `;
            }
        })

    </script>
</body>
