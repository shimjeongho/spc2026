<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPC 쇼핑몰</title>
</head>
<body>
    <h1>상품 리뷰</h1>

    <div class="product-image">
        <img src="https://picsum.photos/600/400">
    </div>

    <!-- 리뷰 작성 폼 -->
    <section class="review-form">
        <h2>후기를 작성해주세요</h2>
        <div>
            <p>평점:</p>
            <label><input type="radio" name="rating" value="1">1</label>
            <label><input type="radio" name="rating" value="2">2</label>
            <label><input type="radio" name="rating" value="3">3</label>
            <label><input type="radio" name="rating" value="4">4</label>
            <label><input type="radio" name="rating" value="5">5</label>
        </div>

        <textarea id="comment" placeholder="후기를 작성해주세요... " rows="5" cols="40"></textarea>
        <button id="send">제출</button>

        <!-- 리뷰 영역 -->
         <section>
            <h2>리뷰</h2>
            <div id="review-container">
                <div class="ai-summary">
                    <p><strong>AI 요약:</strong>현재는 리뷰가 없습니다.</p>
                    <p><strong>평균 별점:</strong>N/A</p>
                </div>
            </div>
         </section>
    </section>
    <script>
        document.getElementById('send').addEventListener('click', async () => {

            const rating = document.querySelector('input[name="rating"]:checked')?.value;
            const comment = document.getElementById('comment').value;

            const response = await fetch("/api/reviews", {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    rating,
                    comment
                }) 
            })

            const data = await response.json();

            const container = document.getElementById('review-container');

            container.innerHTML += `
                <div class="review-item">
                    <p><strong>평점:</strong> ${rating}</p>
                    <p><strong>후기:</strong> ${comment}</p>
                </div>
            `;

            const aiRespones = await fetch("/api/ai-summary");
            const aiData = await aiRespones.json();

            document.querySelector('.ai-summary').innerHTML = `
                <p><strong>AI 요약:</strong> ${aiData.summary}</p>
                <p><strong>평균 별점:</strong> ${aiData.average_rating}</p>
            `;

            console.log(data);
        })
    </script>
</body>
</html>
